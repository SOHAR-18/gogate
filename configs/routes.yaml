routes:
  - path: /users
    upstreams:
      - http://user-service:8081
    protected: true
    rate_limit: 10
    rate_window: 60
    health_path: /health

  - path: /products
    upstreams:
      - http://product-service:8082
    protected: false
    rate_limit: 30
    rate_window: 60
    health_path: /health

  - path: /orders
    upstreams:
      - http://order-service:8083
    protected: true
    rate_limit: 5
    rate_window: 60
    health_path: /health