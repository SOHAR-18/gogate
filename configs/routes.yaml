routes:
  - path: /users
    service_name: user-service
    upstreams:
      - http://user-service:8081
    protected: true
    rate_limit: 10
    rate_window: 60
    health_path: /health

  - path: /products
    service_name: product-service
    upstreams:
      - http://product-service:8082
    protected: false
    rate_limit: 30
    rate_window: 60
    health_path: /health

  - path: /orders
    service_name: order-service
    upstreams:
      - http://order-service:8083
    protected: true
    rate_limit: 5
    rate_window: 60
    health_path: /health