services:

  gateway:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - REDIS_HOST=redis
      - JAEGER_ENDPOINT=jaeger:4318
    depends_on:
      - user-service
      - product-service
      - order-service
      - redis
      - etcd
      - jaeger
    networks:
      - gogate-network

  user-service:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.user
    ports:
      - "8081:8081"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - SERVICE_NAME=user-service
      - SERVICE_URL=http://user-service:8081
    depends_on:
      - etcd
    networks:
      - gogate-network

  product-service:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.product
    ports:
      - "8082:8082"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - SERVICE_NAME=product-service
      - SERVICE_URL=http://product-service:8082
    depends_on:
      - etcd
    networks:
      - gogate-network

  order-service:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.order
    ports:
      - "8083:8083"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - SERVICE_NAME=order-service
      - SERVICE_URL=http://order-service:8083
    depends_on:
      - etcd
    networks:
      - gogate-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gogate-network

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.9
    ports:
      - "2379:2379"
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    networks:
      - gogate-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../deployments/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gogate-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - gogate-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - gogate-network

networks:
  gogate-network:
    driver: bridge